server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Gzip compression for text and asset types
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend React SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html to ensure new deployments load immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Cache bundled immutable static assets (hashed by Vite)
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Student Profile Images:
    # 1. First attempt to serve bundled image from static assets (/usr/share/nginx/html/img/...)
    # 2. If not found (e.g. newly uploaded photo on persistent storage), proxy to the bot service
    location /img/ {
        try_files $uri @proxy_bot_img;
    }

    location @proxy_bot_img {
        proxy_pass http://bot:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Scheduled Birthday Card Previews
    location /scheduled-cards-images/ {
        proxy_pass http://bot:3001/scheduled-cards-images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # WhatsApp QR Code web endpoint (protected by bot's admin verification)
    location /qr {
        proxy_pass http://bot:3001/qr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # Disable all caching for the QR authentication page
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }

    # Bot Health Check Proxy
    location /health {
        proxy_pass http://bot:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
    }

    # Backend API Proxy (/api/* -> http://bot:3001/*)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://bot:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts suitable for Puppeteer and file processing
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Disable caching for all API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
